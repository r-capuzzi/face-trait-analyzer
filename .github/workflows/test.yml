# Runs the unit/component tests and a production build on every PR and
# every push to master, same as body-composition-visualizer's frontend job.
name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # matches local dev
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
