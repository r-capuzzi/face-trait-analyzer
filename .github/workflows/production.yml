# After Vercel finishes a production deploy, run the end-to-end tests
# against the live site: its real headers, its real bundle, the models from
# their real CDNs. Vercel's GitHub integration reports each deploy as a
# GitHub deployment, which is what triggers this.
name: production

on:
  deployment_status:
  workflow_dispatch: # run it by hand from the Actions tab

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # the public production domain, not the per-deploy URL (Vercel may
      # put those behind a login)
      - run: npm run test:e2e:prod
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-e2e-traces
          path: test-results/
          retention-days: 7
