<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- browser chrome matches the page background in each theme -->
    <meta name="theme-color" content="#f4efe7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11100e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Measure your eye, hair and skin color and face shape from a photo, then learn the genetics and evolutionary history behind each trait, with every claim cited. Runs entirely in your browser; the photo is never uploaded."
    />
    <title>Trait Genetics Explainer</title>

    <!-- link previews (Open Graph and Twitter cards); image URLs must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://face-trait-analyzer.vercel.app/" />
    <meta property="og:title" content="Trait Genetics Explainer" />
    <meta
      property="og:description"
      content="Your eye, hair and skin color and face shape, measured from a photo in your browser, with the genes and evolutionary history behind each trait. No ancestry guessing; nothing uploaded."
    />
    <meta property="og:image" content="https://face-trait-analyzer.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Trait Genetics Explainer: a stylized iris next to the title and the promises: your photo never leaves your device, every claim cited, no ancestry or ethnicity guessing."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
